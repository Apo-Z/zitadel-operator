name: Bump Helm chart version

# When a GitHub release is published (tag vX.Y.Z), set the chart version and
# appVersion to X.Y.Z on the default branch and push the commit.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: bump-chart
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a semantic version (vX.Y.Z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chart=charts/zitadel-operator/Chart.yaml
          sed -i -E "s/^version:.*/version: ${VERSION}/" "$chart"
          sed -i -E "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "$chart"
          cat "$chart"

      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/zitadel-operator --strict

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet; then
            echo "Chart already at version ${VERSION}, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/zitadel-operator/Chart.yaml
          git commit -m "chore(chart): bump zitadel-operator chart to ${VERSION}"
          # The default branch may have moved since the checkout.
          for _ in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:${BRANCH}" && exit 0
            sleep 5
          done
          echo "::error::Unable to push the chart bump to ${BRANCH}"
          exit 1
