{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.23.0
  name: zitadelorganizations.zitadel.zitadel-operator.io
spec:
  group: zitadel.zitadel-operator.io
  names:
    categories:
    - zitadel
    kind: ZitadelOrganization
    listKind: ZitadelOrganizationList
    plural: zitadelorganizations
    shortNames:
    - zorg
    singular: zitadelorganization
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.organizationId
      name: Organization ID
      type: string
    - jsonPath: .spec.default
      name: Default
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ZitadelOrganization is an organization of a Zitadel instance with its
          policies, identity providers and actions.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZitadelOrganizationSpec defines the desired state of ZitadelOrganization.
            properties:
              actions:
                description: |-
                  Actions of the organization. Actions created by the operator and later removed
                  from this list are deleted; other actions are left untouched.
                items:
                  description: Action is a Zitadel action (JavaScript) of the organization.
                  properties:
                    allowedToFail:
                      description: AllowedToFail lets the flow continue when the action
                        fails.
                      type: boolean
                    name:
                      description: Name of the action; it must match the function
                        name of the script.
                      minLength: 1
                      type: string
                    script:
                      description: Script of the action.
                      minLength: 1
                      type: string
                    timeout:
                      default: 10s
                      description: Timeout of the action, e.g. "10s".
                      type: string
                    triggers:
                      description: Triggers where the action runs.
                      items:
                        description: ActionTrigger attaches an action to a trigger
                          of a flow.
                        properties:
                          flowType:
                            description: FlowType is the Zitadel flow type ID, e.g.
                              "2" (complement token).
                            pattern: ^[0-9]+$
                            type: string
                          triggerTypes:
                            description: |-
                              TriggerTypes are the trigger type IDs of the flow, e.g. ["4", "5"]
                              (pre userinfo creation, pre access token creation).
                            items:
                              type: string
                            minItems: 1
                            type: array
                        required:
                        - flowType
                        - triggerTypes
                        type: object
                      type: array
                  required:
                  - name
                  - script
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              connectionRef:
                description: |-
                  ConnectionRef references the ZitadelConnection to use. Its service account
                  needs instance permissions (IAM_OWNER).
                properties:
                  name:
                    description: Name of the ZitadelConnection.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              default:
                description: Default makes it the default organization of the instance.
                type: boolean
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy defines what happens in Zitadel when this object is deleted.
                  Deleting an organization deletes all its users, projects and applications.
                enum:
                - Delete
                - Retain
                type: string
              identityProviders:
                description: |-
                  IdentityProviders of the organization, each added to the login policy of the
                  organization (offered on the login page; needs loginPolicy). Providers created
                  by the operator and later removed from this list are deleted; other providers
                  are left untouched.
                items:
                  description: IdentityProvider is an external identity provider of
                    the organization.
                  properties:
                    credentialsSecretRef:
                      description: CredentialsSecretRef holds the OAuth client ID
                        and secret.
                      properties:
                        clientIdKey:
                          default: CLIENT_ID
                          description: ClientIDKey is the key holding the client ID.
                          type: string
                        clientSecretKey:
                          default: CLIENT_SECRET
                          description: ClientSecretKey is the key holding the client
                            secret.
                          type: string
                        name:
                          description: Name of the Secret.
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    name:
                      description: |-
                        Name of the provider in Zitadel (unique in the organization). An existing
                        provider with this name is adopted.
                      minLength: 1
                      type: string
                    options:
                      description: |-
                        Options are the Zitadel provider options (isLinkingAllowed, isCreationAllowed,
                        isAutoCreation, isAutoUpdate, autoLinking…), sent as-is.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    scopes:
                      description: Scopes requested from the provider.
                      items:
                        type: string
                      type: array
                    type:
                      description: Type of the provider.
                      enum:
                      - Google
                      type: string
                  required:
                  - credentialsSecretRef
                  - name
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              lockoutPolicy:
                description: LockoutPolicy of the organization (maxPasswordAttempts,
                  maxOtpAttempts).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              loginPolicy:
                description: |-
                  LoginPolicy of the organization (allowRegister, allowExternalIdp,
                  secondFactors…), sent as-is: give every field.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              name:
                description: |-
                  Name of the organization. Defaults to metadata.name. An existing
                  organization with this name is adopted.
                type: string
              passwordComplexityPolicy:
                description: |-
                  PasswordComplexityPolicy of the organization (hasLowercase, hasUppercase,
                  hasNumber, hasSymbol, minLength), sent as-is: give every field.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - connectionRef
            type: object
          status:
            description: ZitadelOrganizationStatus defines the observed state of ZitadelOrganization.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionName:
                description: ConnectionName used when the organization was created
                  (used for cleanup).
                type: string
              credentialsHashes:
                additionalProperties:
                  type: string
                description: |-
                  CredentialsHashes are hashes of the identity provider credentials last sent
                  to Zitadel, by provider name (to resend them when the Secret changes).
                type: object
              managedActions:
                description: ManagedActions are the action names created by the operator.
                items:
                  type: string
                type: array
              managedIdentityProviders:
                description: ManagedIdentityProviders are the provider names created
                  by the operator.
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              organizationId:
                description: OrganizationID in Zitadel.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
