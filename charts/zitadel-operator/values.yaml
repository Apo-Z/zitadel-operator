image:
  repository: ghcr.io/apo-z/zitadel-operator
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

crds:
  # Install / upgrade the CRDs with the chart.
  install: true
  # Keep the CRDs (and thus every ZitadelProject / ZitadelApplication) when the release is uninstalled.
  keep: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

leaderElection:
  enabled: true

logLevel: info
# Extra arguments for the manager.
extraArgs: []

metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# Optional: credentials Secret created by the chart (prefer an existing Secret,
# e.g. from external-secrets or sealed-secrets, referenced in `connections`).
credentials:
  create: false
  name: zitadel-operator-credentials
  # Content of the service account JSON key (or a personal access token).
  keyJSON: ""

# Optional: ZitadelConnections created by the chart.
connections: []
#  - name: main
#    url: https://auth.example.com
#    internalURL: http://zitadel.zitadel.svc.cluster.local:8080
#    organizationId: ""
#    credentialsSecretRef:            # defaults to the `credentials` Secret above
