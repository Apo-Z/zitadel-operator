---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zitadel-operator
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - zitadel.zitadel-operator.io
  resources:
  - zitadelapplications
  - zitadelorganizations
  - zitadelprojects
  - zitadelsmtpproviders
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - zitadel.zitadel-operator.io
  resources:
  - zitadelapplications/finalizers
  - zitadelorganizations/finalizers
  - zitadelprojects/finalizers
  - zitadelsmtpproviders/finalizers
  verbs:
  - update
- apiGroups:
  - zitadel.zitadel-operator.io
  resources:
  - zitadelapplications/status
  - zitadelconnections/status
  - zitadelorganizations/status
  - zitadelprojects/status
  - zitadelsmtpproviders/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - zitadel.zitadel-operator.io
  resources:
  - zitadelconnections
  verbs:
  - get
  - list
  - watch
