metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: zitadelconnections.zitadel.zitadel-operator.io
spec:
  group: zitadel.zitadel-operator.io
  names:
    categories:
    - zitadel
    kind: ZitadelConnection
    listKind: ZitadelConnectionList
    plural: zitadelconnections
    shortNames:
    - zcon
    singular: zitadelconnection
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.organizationName
      name: Organization
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ZitadelConnection is a cluster-scoped connection to a Zitadel instance. It
          holds the admin credentials so that application namespaces never see them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZitadelConnectionSpec defines how to reach a Zitadel instance.
            properties:
              allowedNamespaces:
                description: |-
                  AllowedNamespaces restricts the namespaces whose ZitadelProject /
                  ZitadelApplication may use this connection. Empty means all namespaces.
                  Entries support shell-like globs ("team-*").
                items:
                  type: string
                type: array
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef references the credentials of a Zitadel service account
                  with either the ORG_OWNER role on the organization (projects are created by
                  the operator) or the PROJECT_OWNER role on existing projects (least privilege).
                properties:
                  key:
                    default: key.json
                    description: |-
                      Key in the Secret. Its content is either a service account JSON key
                      (as downloaded from the Zitadel console, recommended) or a personal access token.
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              insecureSkipTLSVerify:
                description: InsecureSkipTLSVerify disables TLS certificate verification.
                  Do not use in production.
                type: boolean
              internalURL:
                description: |-
                  InternalURL is an optional endpoint used for API calls instead of URL, for
                  example the in-cluster service (http://zitadel.zitadel.svc.cluster.local:8080).
                  The Host header is still set to the host of URL so Zitadel resolves the instance.
                pattern: ^https?://
                type: string
              organizationId:
                description: |-
                  OrganizationID is the default organization in which resources are created.
                  Defaults to the organization of the service account.
                type: string
              url:
                description: |-
                  URL is the public URL (issuer) of the Zitadel instance, e.g. https://auth.example.com.
                  It is used as the OIDC issuer written in application Secrets.
                pattern: ^https?://
                type: string
            required:
            - credentialsSecretRef
            - url
            type: object
          status:
            description: ZitadelConnectionStatus defines the observed state of ZitadelConnection.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              organizationId:
                description: OrganizationID effectively used by default.
                type: string
              organizationName:
                description: OrganizationName of the default organization.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
