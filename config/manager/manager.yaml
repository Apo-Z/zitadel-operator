apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel-operator
  labels:
    app.kubernetes.io/name: zitadel-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-operator
    spec:
      serviceAccountName: zitadel-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: controller:latest
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
